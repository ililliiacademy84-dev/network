x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Shared runtime config for the API and the worker (same image build context).
x-backend-env: &backend-env
  env_file: ./backend/.env
  environment:
    NODE_ENV: ${NODE_ENV:-production}
    PORT: "8080"
    # Container DNS always wins over anything in backend/.env.
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-school_db}?schema=public
    REDIS_URL: redis://redis:6379
    TZ: ${TZ:-UTC}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-school_db}
    # Not published to the host: only the API/worker talk to the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-school_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *backend-env
    # Cron/BullMQ processing lives in `worker`; flip to true for a one-box dev stack.
    environment:
      RUN_JOBS: "false"
    networks: [internal, edge]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose:
      - "8080"
    logging: *default-logging

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    <<: *backend-env
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_started }
    logging: *default-logging

  face-service:
    build:
      context: ./face-service
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [internal]
    environment:
      FACE_INTERNAL_TOKEN: ${FACE_INTERNAL_TOKEN:-}
    depends_on:
      postgres: { condition: service_healthy }
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    networks: [internal, edge]
    depends_on:
      - api
    expose:
      - "5173"
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [edge]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      # TLS material written by certbot (see infra/certbot/scripts/renew-cert.ps1).
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/webroot:/var/www/certbot:ro
    depends_on:
      - api
      - frontend
    logging: *default-logging

networks:
  # Nothing external reaches this network - no gateway to the host.
  internal:
    driver: bridge
    internal: true
  # Only nginx (the edge) and the two upstreams it proxies to.
  edge:
    driver: bridge

volumes:
  pgdata:
  redisdata:
